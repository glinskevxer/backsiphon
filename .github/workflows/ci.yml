name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: types
        run: npm run typecheck

      - name: tests
        run: npm test

      - name: build
        run: npm run build

      - name: coverage
        run: npm run coverage
