name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a second push while the first is still running makes the first one pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: types
        run: npm run typecheck
      - name: formatting
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts" "scripts/**/*.ts"

  test:
    name: tests on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.1', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: tests
        run: npm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: coverage
        run: npm run coverage
      - name: keep the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  handbook:
    name: the handbook matches the tables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - run: npm run handbook:check
      - run: npm run commands:check

  export:
    name: what git would ship
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: export check
        run: npm run export-check
      - name: release check
        run: npm run release-check

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: read the advisories against what ships
        run: npm audit --omit=dev --json > audit.json || true
      - name: decide about them
        run: npx tsx scripts/audit-dependencies.ts --from-audit audit.json
      - name: read the advisories against the toolchain, for information
        run: npm audit --json > audit-dev.json || true
      - name: print them
        run: npx tsx scripts/audit-dependencies.ts --from-audit audit-dev.json --report-only
